<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinDash{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <style>
:root {
    /* Dark Mode (Default) */
    --bg-dark: #121212;
    --bg-darker: #0A0A0A;
    --text-light: #FFFFFF;
    --text-lighter: #E0E0E0;
    --accent-cyan: #00FFFF;
    --accent-dark: #008B8B;
    --accent-green: #00ffcc;
    --income-green: #00FFAA;
    --expense-red: #FF6B6B;
    --card-bg: #1E1E1E;

    --goal-orange: #FFA500;   
    --goal-pink: #FF69B4;     
    --goal-green: #00FF7F;    
    --goal-purple: #9B30FF;
}
    </style>

    {% if session is defined and session.get('theme', 'dark') == 'light' %}
    <style>
:root {
    --bg-dark: #f5f5f5;
    --bg-darker: #e0e0e0;
    --text-light: #000000;
    --text-lighter: #555555;
    --accent-cyan: #800080;   
    --accent-dark: #4B0082;   
    --accent-green: #7e04f8;
    --income-green: #007c3e;
    --expense-red: #b10606;
    --card-bg: #ffffff;

    --goal-orange: #FF8C00;   
    --goal-pink: #C71585;     
    --goal-green: #228B22;    
    --goal-purple: #6A0DAD;
}
</style>
    {% endif %}

    {% block head %}{% endblock %}
</head>
<body>
            {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
